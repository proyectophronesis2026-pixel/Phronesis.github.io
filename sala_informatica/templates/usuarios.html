{% extends "base.html" %}
{% block titulo %}Gestión de usuarios · {{ nombre_proyecto }}{% endblock %}

{% block contenido %}
<div class="app-shell">
    <header class="cabecera">
        <div class="cabecera__marca">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="{{ nombre_proyecto }}" class="logo-cabecera">
            <div>
                <span class="eyebrow">{{ nombre_proyecto }}</span>
                <h1>Gestión de usuarios</h1>
            </div>
        </div>
        <div class="cabecera__usuario">
            <a href="{{ url_for('index') }}" class="boton boton--fantasma">← Volver al inventario</a>
            <a href="{{ url_for('logout') }}" class="boton boton--fantasma">Cerrar sesión</a>
        </div>
    </header>

    <main class="contenedor">
        <div class="barra-acciones">
            <p class="contador" id="contador-usuarios">Cargando cuentas…</p>
            <button type="button" class="boton boton--primario" id="btn-abrir-modal">+ Añadir cuenta</button>
        </div>

        <p id="mensaje-error" class="aviso aviso--error oculto"></p>

        <section class="grid-equipos" id="grid-usuarios" aria-live="polite"></section>
    </main>
</div>

<!-- Plantilla de tarjeta de cuenta -->
<template id="plantilla-usuario">
    <article class="ficha-equipo">
        <div class="ficha-equipo__cabecera">
            <span class="ficha-equipo__numero" data-campo="nombre_usuario"></span>
            <span class="sello" data-campo="rol"></span>
        </div>
        <p class="ficha-equipo__marca" data-campo="nombre_completo"></p>
        <p class="ficha-equipo__serial" data-campo="correo"></p>
        <p class="ficha-equipo__serial" data-campo="fecha_creacion"></p>
        <div class="ficha-equipo__acciones">
            <button type="button" class="boton boton--secundario boton--pequeno" data-accion="editar">Editar</button>
            <button type="button" class="boton boton--peligro boton--pequeno" data-accion="eliminar">Eliminar cuenta</button>
        </div>
    </article>
</template>

<!-- Modal para añadir una cuenta nueva -->
<div class="modal oculto" id="modal-nueva-cuenta">
    <div class="modal__panel">
        <h2>Añadir cuenta</h2>
        <p id="modal-error" class="aviso aviso--error oculto"></p>
        <form id="form-nueva-cuenta" class="formulario">
            <label for="nombre_completo">Nombre completo</label>
            <input type="text" id="nombre_completo" name="nombre_completo" required autofocus>

            <label for="nombre_usuario">Usuario</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" required autocomplete="off">

            <label for="correo">Correo (Gmail, para recuperar la contraseña)</label>
            <input type="email" id="correo" name="correo" required autocomplete="off">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" required autocomplete="new-password">

            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option value="consulta">Consulta (solo ver equipos)</option>
                <option value="editor">Edición (editar equipos, sin poder eliminarlos)</option>
                <option value="admin">Administrador (control total)</option>
            </select>

            <div class="modal__acciones">
                <button type="button" class="boton boton--fantasma" id="btn-cancelar-modal">Cancelar</button>
                <button type="submit" class="boton boton--primario">Crear cuenta</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal para editar una cuenta existente -->
<div class="modal oculto" id="modal-editar-cuenta">
    <div class="modal__panel">
        <h2>Editar cuenta</h2>
        <p id="modal-editar-error" class="aviso aviso--error oculto"></p>
        <form id="form-editar-cuenta" class="formulario">
            <input type="hidden" id="editar_id" name="editar_id">

            <label for="editar_nombre_completo">Nombre completo</label>
            <input type="text" id="editar_nombre_completo" name="nombre_completo" required autofocus>

            <label for="editar_correo">Correo (Gmail, para recuperar la contraseña)</label>
            <input type="email" id="editar_correo" name="correo" required>

            <label for="editar_rol">Rol</label>
            <select id="editar_rol" name="rol" required>
                <option value="consulta">Consulta (solo ver equipos)</option>
                <option value="editor">Edición (editar equipos, sin poder eliminarlos)</option>
                <option value="admin">Administrador (control total)</option>
            </select>

            <div class="modal__acciones">
                <button type="button" class="boton boton--fantasma" id="btn-cancelar-editar">Cancelar</button>
                <button type="submit" class="boton boton--primario">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>

<script>
    const USUARIO_ACTUAL_ID = {{ usuario_actual_id }};
</script>
<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>
{% endblock %}
